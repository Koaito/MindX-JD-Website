{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu — MindX Career Hub{% endblock %}
{% block content %}

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Career Hub / Tài khoản</span>
    <h1>Đặt lại mật khẩu</h1>
    <p class="lede">Nhập mật khẩu mới cho tài khoản của bạn.</p>

    <form method="post">
      <input type="hidden" name="token" value="{{ token }}">
      <label>Mật khẩu mới (tối thiểu 8 ký tự)
        <input type="password" name="new_password" required minlength="8" autofocus>
      </label>
      <label>Nhập lại mật khẩu mới
        <input type="password" name="new_password_confirm" required minlength="8">
      </label>
      <button class="btn btn-primary" type="submit">Đặt lại mật khẩu</button>
    </form>

    <p class="auth-foot">Đổi xong bạn sẽ cần đăng nhập lại bằng mật khẩu mới.</p>
  </div>
</div>

{% endblock %}

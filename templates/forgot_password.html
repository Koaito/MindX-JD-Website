{% extends "base.html" %}
{% block title %}Quên mật khẩu — MindX Career Hub{% endblock %}
{% block content %}

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Career Hub / Tài khoản</span>
    <h1>Quên mật khẩu</h1>
    <p class="lede">Nhập email đã đăng ký — chúng tôi sẽ gửi link đặt lại mật khẩu tới đó.</p>

    <form method="post">
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </label>
      <button class="btn btn-primary" type="submit">Gửi link đặt lại mật khẩu</button>
    </form>

    <p class="auth-foot"><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p>
  </div>
</div>

{% endblock %}
